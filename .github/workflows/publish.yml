name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Strip a stray trailing newline from the signing passphrase.
      - name: Prepare signing passphrase
        env:
          RAW_SIGNING_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          PW="${RAW_SIGNING_PASSWORD%"${RAW_SIGNING_PASSWORD##*[![:space:]]}"}"
          echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$PW" >> "$GITHUB_ENV"

      # Publishing credentials come from GH Actions secrets. SIGNING_KEY_ID must be
      # the 8-hex short key id (i.e., 436EB281). The 16-hex "0x..." form is rejected by Gradle.
      - name: Build and publish to Maven Central
        run: ./gradlew build publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername:      ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:      ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:        ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId:      ${{ secrets.SIGNING_KEY_ID }}
